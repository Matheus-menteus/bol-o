name: Atualizar Vitrine de Jogos
on:
  schedule:
    - cron: "0 */6 * * *"   # Roda a cada 6 horas (UTC)
  workflow_dispatch:        # Permite rodar manualmente no botão do GitHub
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar jogos das Ligas e gerar vitrine
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
        run: node scripts/gerar-vitrine.mjs

      - name: Commit se mudou
        run: |
          if [[ -n "$(git status --porcelain dados/vitrine.json)" ]]; then
            git config user.name "hub-bot"
            git config user.email "bot@users.noreply.github.com"
            git add dados/vitrine.json
            git commit -m "Atualiza vitrine de jogos"
            git push
          else
            echo "Nenhuma mudança na agenda de jogos hoje."
          fi
