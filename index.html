<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hub de Futebol & IA</title>
<style>
:root {
  --pitch:#0A2B23; --pitch2:#0E3A2E; --paper:#FBFAF6; --ink:#10211C; --line:#E7E5DA;
  --pick:#00C27A; --pick2:#00A266; --pickink:#04150F; --gold:#E9B949; --muted:#7C8B83;
  --teal:#117A65; --shadow:0 10px 30px rgba(0,0,0,.18);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; padding:0; }
body {
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); min-height:100vh; padding-bottom:40px; position:relative;
  background:linear-gradient(180deg,var(--pitch),var(--pitch2));
}
body::before {
  content:""; position:fixed; inset:0; z-index:-2;
  background-image:url('https://images.unsplash.com/photo-1518605368461-1e1e38ce8058?q=80&w=1000&auto=format&fit=crop'); /* Fundo genérico de gramado */
  background-size:cover; background-position:center; opacity: 0.15;
}

.wrap { max-width:600px; margin:0 auto; padding:0 14px 60px; }
header { text-align:center; padding:22px 14px 14px; }
.eyebrow { font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:8px; }
h1 { margin:0; color:#fff; font-size:28px; font-weight:900; letter-spacing:.01em; text-transform:uppercase; }
h1 .thin { display:block; font-size:13px; font-weight:600; letter-spacing:.16em; color:#bfe8d6; margin-top:7px; }

/* Navegação e Filtros */
.filtros { display:flex; gap:7px; flex-wrap:wrap; margin:14px 0; justify-content: center; }
.filtros button {
  border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06);
  color:#cfe9dd; font-family:inherit; font-weight:700; font-size:13px;
  padding:7px 15px; border-radius:999px; cursor:pointer; transition: all 0.2s;
}
.filtros button.active { background:var(--teal); color:#fff; border-color:var(--teal); }

.day { display:flex; align-items:center; gap:10px; margin:18px 2px 10px; }
.day .dot { width:7px; height:7px; border-radius:99px; background:var(--gold); }
.day .d { color:#fff; font-weight:800; font-size:13px; letter-spacing:.05em; text-transform:uppercase; }
.day .line { flex:1; height:1px; background:rgba(255,255,255,.16); }

/* Cards de Jogo */
.match {
  background:var(--paper); border-radius:14px; box-shadow:var(--shadow);
  padding:12px 12px 13px; margin-bottom:11px; cursor: pointer;
  transition: transform 0.1s, box-shadow 0.2s;
}
.match:active { transform: scale(0.98); }
.match-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
.grp { display:flex; align-items:center; gap:6px; font-size:10px; font-weight:800; letter-spacing:.05em; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:3px 7px; }
.grp img { width: 14px; height: 14px; }
.st { font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:99px; }
.st.enc { background:#E9F7F0; color:var(--pick2); }
.st.pend { background:#EFEDE6; color:var(--muted); }
.st.live { background:#ef4444; color:#fff; animation: pulse 2s infinite; }

.teams { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:6px; }
.team { display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; }
.team img { width: 36px; height: 36px; object-fit: contain; } /* Escudos via API */
.team .nm { font-size:13px; font-weight:700; line-height:1.15; }

.vs { font-size:12px; font-weight:800; color:var(--muted); }
.score { font-size:26px; font-weight:900; color:var(--ink); font-variant-numeric:tabular-nums; min-width:62px; text-align:center; }
.score span { color:var(--muted); font-weight:700; margin:0 3px; font-size:18px; }
.score.pend { font-size:14px; font-weight:800; color:var(--muted); }

/* Views SPA */
.view { display: none; }
.view.active { display: block; animation: fadeIn 0.3s; }

/* Botão Voltar */
.btn-voltar {
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  color: #fff; padding: 8px 16px; border-radius: 99px; font-weight: 700;
  cursor: pointer; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 5px;
}

/* Tabs Internas da Partida */
.partida-tabs { display:flex; gap:6px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:5px; margin-bottom: 20px; }
.partida-tabs button { flex:1; border:none; background:transparent; color:#cfe9dd; font-weight:800; font-size:11.5px; padding:11px 3px; border-radius:10px; cursor:pointer; }
.partida-tabs button.active { background:var(--pick); color:var(--pickink); box-shadow:0 4px 12px rgba(0,194,122,.35); }

.tab-content { display: none; color: #fff; }
.tab-content.active { display: block; }
.panel { background: var(--paper); border-radius: 14px; padding: 16px; color: var(--ink); box-shadow: var(--shadow); }

@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
.loading { text-align:center; color:#cfe9dd; padding:40px; font-weight: bold; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">⚽ Inteligência & Estatísticas</div>
    <h1>Futebol Hub<span class="thin">Análises IA · Live Stats · Tendências</span></h1>
  </header>

  <!-- TELA INICIAL: VITRINE DE JOGOS -->
  <div id="view-vitrine" class="view active">
    <div class="filtros" id="filtros">
      <button data-dia="todos" class="active">Todos</button>
      <button data-dia="ontem">Ontem</button>
      <button data-dia="hoje">Hoje</button>
      <button data-dia="amanha">Amanhã</button>
    </div>
    <div id="lista-jogos"><div class="loading">Buscando agenda de jogos...</div></div>
  </div>

  <!-- TELA DE DETALHES DA PARTIDA -->
  <div id="view-partida" class="view">
    <button class="btn-voltar" onclick="voltarParaVitrine()">⬅ Voltar para Jogos</button>
    
    <!-- Cabeçalho do jogo selecionado será injetado aqui -->
    <div id="partida-header"></div>

    <div class="partida-tabs" id="tabs-partida">
      <button data-tab="panorama" class="active">🧠 Panorama IA</button>
      <button data-tab="insights">💰 Insights</button>
      <button data-tab="live">📊 Ao Vivo</button>
    </div>

    <!-- Abas de Conteúdo -->
    <div id="tab-panorama" class="tab-content active">
      <div class="panel" id="conteudo-panorama">
        <p style="text-align: center; color: var(--muted); font-weight: bold;">
          A IA está analisando este confronto taticamente... ⏳
        </p>
      </div>
    </div>
    
    <div id="tab-insights" class="tab-content">
      <div class="panel" id="conteudo-insights">
        <p style="text-align: center; color: var(--muted); font-weight: bold;">
          Buscando tendências de apostas... ⏳
        </p>
      </div>
    </div>

    <div id="tab-live" class="tab-content">
      <div class="panel" id="conteudo-live">
        <p style="text-align: center; color: var(--muted); font-weight: bold;">
          Estatísticas ao vivo carregarão aqui.
        </p>
      </div>
    </div>
  </div>
</div>

<script>
let jogosGlobal = [];
let iaCarregada = false;
let jogoAtualId = null;

// Funções Utilitárias de Data
const formatarData = (isoStr) => {
  const d = new Date(isoStr);
  return d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' }).replace('.', '');
};
const formatarHora = (isoStr) => {
  const d = new Date(isoStr);
  return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
};
const pegarDataLocal = (isoStr) => new Date(isoStr).toLocaleDateString('pt-BR');

// -------------------------------------------------------------
// NOVO: SALVAR NO PEN DRIVE DO NAVEGADOR (LocalStorage)
// -------------------------------------------------------------
function salvarMemoriaNoNavegador() {
  // Converte nossa memória global em texto e salva no navegador
  localStorage.setItem('futebolHubMemoria', JSON.stringify(jogosGlobal));
}

// Carrega os dados da Vitrine + Memória Local
async function carregarVitrine() {
  try {
    const res = await fetch(`dados/vitrine.json?v=${Date.now()}`);
    if (!res.ok) throw new Error("Sem vitrine");
    let data = await res.json();
    
    // --- NOVO: LENDO A MEMÓRIA DO NAVEGADOR ---
    const memoriaSalva = localStorage.getItem('futebolHubMemoria');
    if (memoriaSalva) {
        const memoriaParseada = JSON.parse(memoriaSalva);
        
        // Vamos varrer os jogos do GitHub e injetar os dados salvos do navegador neles
        data.jogos = data.jogos.map(jogoNovo => {
            const jogoLembrado = memoriaParseada.find(j => String(j.id) === String(jogoNovo.id));
            if (jogoLembrado) {
                // Se a gente lembra desse jogo, restaura o placar, status e a IA gerada!
                if (jogoLembrado.status) jogoNovo.status = jogoLembrado.status;
                if (jogoLembrado.casa?.placar !== undefined) jogoNovo.casa.placar = jogoLembrado.casa.placar;
                if (jogoLembrado.fora?.placar !== undefined) jogoNovo.fora.placar = jogoLembrado.fora.placar;
                if (jogoLembrado.iaCache) jogoNovo.iaCache = jogoLembrado.iaCache;
            }
            return jogoNovo;
        });
    }
    // ------------------------------------------

    jogosGlobal = data.jogos;
    renderizarJogos("todos");
  } catch (error) {
    document.getElementById('lista-jogos').innerHTML = 
      `<div class="loading" style="color:var(--gold);">Agenda ainda não gerada ou erro ao carregar.<br>Verifique o GitHub Actions!</div>`;
  }
}

// Renderiza a Vitrine
function renderizarJogos(filtroDia) {
  const container = document.getElementById('lista-jogos');
  container.innerHTML = "";
  
  const hojeStr = new Date().toLocaleDateString('pt-BR');
  let ontem = new Date(); ontem.setDate(ontem.getDate() - 1);
  const ontemStr = ontem.toLocaleDateString('pt-BR');
  let amanha = new Date(); amanha.setDate(amanha.getDate() + 1);
  const amanhaStr = amanha.toLocaleDateString('pt-BR');

  let dataAtual = "";

  const jogosFiltrados = jogosGlobal.filter(j => {
    const dataJogo = pegarDataLocal(j.dataHora);
    if (filtroDia === "hoje") return dataJogo === hojeStr;
    if (filtroDia === "ontem") return dataJogo === ontemStr;
    if (filtroDia === "amanha") return dataJogo === amanhaStr;
    return true; 
  });

  if (jogosFiltrados.length === 0) {
    container.innerHTML = `<div class="loading">Nenhum jogo encontrado para esta data.</div>`;
    return;
  }

  jogosFiltrados.forEach(j => {
    const dataJogo = formatarData(j.dataHora);
    if (dataJogo !== dataAtual) {
      container.innerHTML += `<div class="day"><span class="dot"></span><span class="d">${dataJogo}</span><span class="line"></span></div>`;
      dataAtual = dataJogo;
    }

    let stHtml = `<span class="st pend">A iniciar</span>`;
    let scoreHtml = `<div class="score pend">${formatarHora(j.dataHora)}</div>`;
    
    if (['1H', '2H', 'HT', 'ET', 'P', 'BT', 'LIVE'].includes(j.status)) {
      stHtml = `<span class="st live">Ao Vivo</span>`;
      scoreHtml = `<div class="score">${j.casa.placar}<span>-</span>${j.fora.placar}</div>`;
    } else if (['FT', 'AET', 'PEN'].includes(j.status)) {
      stHtml = `<span class="st enc">Encerrado</span>`;
      scoreHtml = `<div class="score">${j.casa.placar}<span>-</span>${j.fora.placar}</div>`;
    }

    const card = `
      <div class="match" onclick="abrirJogo('${j.id}')">
        <div class="match-top">
          <span class="grp"><img src="${j.competicaoLogo}" alt=""> ${j.competicao}</span>
          ${stHtml}
        </div>
        <div class="teams">
          <div class="team">
            <img src="${j.casa.escudo}" alt="${j.casa.nome}">
            <span class="nm">${j.casa.nome}</span>
          </div>
          ${scoreHtml}
          <div class="team">
            <img src="${j.fora.escudo}" alt="${j.fora.nome}">
            <span class="nm">${j.fora.nome}</span>
          </div>
        </div>
      </div>
    `;
    container.innerHTML += card;
  });
}

// Navegação SPA
function abrirJogo(id) {
  const jogo = jogosGlobal.find(j => String(j.id) === String(id));
  if (!jogo) return;
  
  jogoAtualId = id;
  iaCarregada = false;

  document.getElementById('view-vitrine').classList.remove('active');
  document.getElementById('view-partida').classList.add('active');
  window.scrollTo({top: 0, behavior: 'smooth'});

  let scoreText = ['FT', 'AET', 'PEN', '1H', 'HT', '2H', 'ET', 'LIVE'].includes(jogo.status) 
    ? `${jogo.casa.placar} - ${jogo.fora.placar}` 
    : formatarHora(jogo.dataHora);

  document.getElementById('partida-header').innerHTML = `
    <div class="match" style="cursor: default; transform: none; box-shadow: none;">
       <div style="text-align:center; font-size: 11px; font-weight: bold; color: var(--muted); margin-bottom: 10px;">
          ${jogo.competicao} · Carregando...
       </div>
       <div class="teams">
          <div class="team"><img src="${jogo.casa.escudo}"><span class="nm">${jogo.casa.nome}</span></div>
          <div class="score">${scoreText}</div>
          <div class="team"><img src="${jogo.fora.escudo}"><span class="nm">${jogo.fora.nome}</span></div>
        </div>
    </div>
  `;

  document.querySelectorAll('#tabs-partida button').forEach(b => b.classList.remove('active'));
  document.querySelector('#tabs-partida button[data-tab="live"]').classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-live').classList.add('active');

  document.getElementById('conteudo-panorama').innerHTML = '<div class="loading">⏳ Clique na aba para carregar a análise da IA</div>';
  document.getElementById('conteudo-insights').innerHTML = '<div class="loading">⏳ Clique na aba para carregar as tendências</div>';
  
  buscarEstatisticas(id);
}

// Busca Estatísticas
function buscarEstatisticas(id) {
  const container = document.getElementById('conteudo-live');
  container.innerHTML = '<div class="loading">Buscando dados em tempo real... ⏳</div>';

  fetch(`/api/analise?jogoId=${id}&acao=stats`)
    .then(res => res.json())
    .then(data => {
       if(data.error) {
         container.innerHTML = '<p style="color: red; text-align: center;">Erro ao carregar dados.</p>';
         return;
       }
       
       const fix = data.liveStats.fixture;
       const stats = data.liveStats.statistics;
       const gols = data.liveStats.goals;
       const liga = data.liveStats.league;
       const eventos = data.liveStats.events || []; 
       
       // --- ATUALIZA A MEMÓRIA E SALVA NO NAVEGADOR ---
       const indexJogo = jogosGlobal.findIndex(j => String(j.id) === String(id));
       if (indexJogo !== -1) {
           jogosGlobal[indexJogo].status = fix.status.short;
           jogosGlobal[indexJogo].casa.placar = gols.home ?? 0;
           jogosGlobal[indexJogo].fora.placar = gols.away ?? 0;
           
           salvarMemoriaNoNavegador(); // Chama nossa nova função de backup!
       }
       // ----------------------------------------------

       let statusTempo = fix.status.short;
       if (fix.status.elapsed && ['1H', '2H', 'HT', 'ET', 'LIVE'].includes(fix.status.short)) {
           statusTempo = `<span style="color: #ef4444; animation: pulse 2s infinite;">${fix.status.elapsed}'</span>`;
       } else if (['FT', 'AET', 'PEN'].includes(fix.status.short)) {
           statusTempo = "Encerrado";
       } else {
           statusTempo = formatarHora(fix.date);
       }

       document.getElementById('partida-header').innerHTML = `
         <div class="match" style="cursor: default; transform: none; box-shadow: none;">
            <div style="text-align:center; font-size: 11px; font-weight: bold; color: var(--muted); margin-bottom: 10px;">
               ${liga.name} · ${statusTempo}
            </div>
            <div class="teams">
               <div class="team"><img src="${data.liveStats.teams.home.logo}"><span class="nm">${data.liveStats.teams.home.name}</span></div>
               <div class="score">${gols.home ?? 0}<span>-</span>${gols.away ?? 0}</div>
               <div class="team"><img src="${data.liveStats.teams.away.logo}"><span class="nm">${data.liveStats.teams.away.name}</span></div>
             </div>
         </div>
       `;

       let htmlEventos = '';
       const golsECartoes = eventos.filter(e => e.type === "Goal" || e.type === "Card").reverse();
       
       if (golsECartoes.length > 0) {
           htmlEventos = `<div style="margin-bottom: 20px; font-size: 13px; line-height: 1.8; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px;">
                            <h4 style="margin: 0 0 15px 0; font-size: 11px; color: var(--muted); text-transform: uppercase; text-align: center;">Eventos da Partida</h4>
                            <div style="display: flex; flex-direction: column; gap: 10px;">`;
           
           const idCasa = data.liveStats.teams.home.id;

           golsECartoes.forEach(e => {
               let icone = "⚽";
               if (e.type === "Goal" && e.detail === "Missed Penalty") icone = "❌";
               if (e.type === "Card" && e.detail.includes("Yellow")) icone = "🟨";
               if (e.type === "Card" && e.detail.includes("Red")) icone = "🟥";

               const tempo = e.time.elapsed + (e.time.extra ? `+${e.time.extra}` : '') + "'";
               const jogador = e.player.name || "Jogador";

               if (e.team.id === idCasa) {
                   htmlEventos += `
                     <div style="display: flex; width: 100%;">
                        <div style="width: 50%; text-align: right; padding-right: 15px; border-right: 1px solid var(--line);">
                           ${jogador} ${icone} <b style="color:var(--teal); margin-left:5px;">${tempo}</b>
                        </div>
                        <div style="width: 50%;"></div>
                     </div>`;
               } else {
                   htmlEventos += `
                     <div style="display: flex; width: 100%;">
                        <div style="width: 50%; border-right: 1px solid var(--line);"></div>
                        <div style="width: 50%; text-align: left; padding-left: 15px; margin-left: -1px; border-left: 1px solid var(--line);">
                           <b style="color:var(--teal); margin-right:5px;">${tempo}</b> ${icone} ${jogador}
                        </div>
                     </div>`;
               }
           });
           htmlEventos += `</div></div>`;
       } else if (['1H', '2H', 'HT', 'LIVE', 'FT'].includes(fix.status.short)) {
           htmlEventos = `<p style="text-align:center; font-size: 13px; color: var(--muted);">Nenhum gol ou cartão registrado ainda.</p>`;
       }

       let htmlStats = `
          <div style="text-align:center; font-size: 13px; margin-bottom:15px; border-bottom: 1px solid var(--line); padding-bottom: 10px;">
            <p><b>Estádio:</b> ${fix.venue.name || 'Não informado'} | <b>Árbitro:</b> ${fix.referee || '-'}</p>
          </div>
       `;

       htmlStats += htmlEventos;

       if (stats && stats.length > 1) {
          const hStats = stats[0].statistics;
          const aStats = stats[1].statistics;
          const pegaDado = (arr, tipo) => arr.find(s => s.type === tipo)?.value || 0;

          htmlStats += `
            <div style="display:flex; justify-content:space-between; margin-top:15px; font-size:14px; font-weight:bold;">
               <span style="color:var(--teal)">${pegaDado(hStats, "Ball Possession")}</span>
               <span style="color:var(--muted)">Posse de Bola</span>
               <span style="color:var(--teal)">${pegaDado(aStats, "Ball Possession")}</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:12px; font-size:14px; font-weight:bold;">
               <span style="color:var(--teal)">${pegaDado(hStats, "Total Shots")}</span>
               <span style="color:var(--muted)">Finalizações</span>
               <span style="color:var(--teal)">${pegaDado(aStats, "Total Shots")}</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:12px; font-size:14px; font-weight:bold;">
               <span style="color:var(--teal)">${pegaDado(hStats, "Fouls")}</span>
               <span style="color:var(--muted)">Faltas</span>
               <span style="color:var(--teal)">${pegaDado(aStats, "Fouls")}</span>
            </div>
          `;
       } else {
          htmlStats += `<p style="text-align:center; font-size: 13px; color: var(--muted); margin-top: 15px;">Estatísticas aprofundadas ficarão disponíveis durante o jogo.</p>`;
       }

       htmlStats += `
          <div style="text-align: center; margin-top: 25px;">
            <button onclick="buscarEstatisticas('${id}')" style="background: var(--pick); color: var(--pickink); border: none; padding: 10px 24px; border-radius: 99px; font-weight: 800; cursor: pointer; font-size: 13px; box-shadow: 0 4px 12px rgba(0,194,122,.35); transition: transform 0.1s;">
              🔄 Atualizar Tempo Real
            </button>
          </div>
       `;
       
       container.innerHTML = htmlStats;
    })
    .catch(err => {
       container.innerHTML = '<p style="color: red; text-align: center;">Falha ao carregar estatísticas.</p>';
    });
}

function renderizarIA(panorama, insights, id) {
  document.getElementById('conteudo-panorama').innerHTML = 
    `<p style="line-height: 1.6; font-size: 14px;">${panorama.replace(/\n/g, '<br>')}</p>
     <div style="text-align: center; margin-top: 25px; border-top: 1px solid var(--line); padding-top: 15px;">
        <button onclick="buscarIA('${id}')" style="background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 8px 16px; border-radius: 99px; cursor: pointer; font-size: 12px;">🔄 Forçar Nova Análise</button>
     </div>`;

  const arrayInsights = Array.isArray(insights) ? insights : insights.split('\n');
  const insightsHtml = arrayInsights.map(linha => {
    if (linha.trim() === '') return '';
    return `<li style="margin-bottom: 12px; line-height: 1.5; font-size: 14px; color: var(--ink);">
              <span style="color: var(--gold); font-weight: 900; margin-right: 6px;">•</span> 
              ${linha.replace(/^-\s*/, '')}
            </li>`;
  }).join('');
  
  document.getElementById('conteudo-insights').innerHTML = 
    `<ul style="padding-left: 0; list-style-type: none; margin: 0;">${insightsHtml}</ul>
     <div style="text-align: center; margin-top: 25px; border-top: 1px solid var(--line); padding-top: 15px;">
        <button onclick="buscarIA('${id}')" style="background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 8px 16px; border-radius: 99px; cursor: pointer; font-size: 12px;">🔄 Gerar Novos Insights</button>
     </div>`;
}

function buscarIA(id) {
  iaCarregada = true; 
  document.getElementById('conteudo-panorama').innerHTML = '<div class="loading">A IA está decifrando as táticas deste jogo... ⏳</div>';
  document.getElementById('conteudo-insights').innerHTML = '<div class="loading">Buscando as melhores tendências... ⏳</div>';

  fetch(`/api/analise?jogoId=${id}&acao=ia`)
    .then(res => res.json())
    .then(data => {
       if(data.error) throw new Error(data.error);
       
       const index = jogosGlobal.findIndex(j => String(j.id) === String(id));
       if (index !== -1) {
           jogosGlobal[index].iaCache = { panorama: data.panorama, insights: data.insights };
           
           salvarMemoriaNoNavegador(); // Salva a IA no Pen Drive invisível!
       }
       
       renderizarIA(data.panorama, data.insights, id);
    })
    .catch(err => {
       document.getElementById('conteudo-panorama').innerHTML = '<p style="color: red; text-align: center;">Falha ao conectar com a Inteligência Artificial.</p>';
       document.getElementById('conteudo-insights').innerHTML = '<p style="color: red; text-align: center;">Falha ao gerar insights.</p>';
       iaCarregada = false; 
    });
}

function voltarParaVitrine() {
  const filtroAtivo = document.querySelector('#filtros button.active').dataset.dia;
  renderizarJogos(filtroAtivo);
  document.getElementById('view-partida').classList.remove('active');
  document.getElementById('view-vitrine').classList.add('active');
}

// Filtros da vitrine
document.querySelectorAll('#filtros button').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('#filtros button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    renderizarJogos(e.target.dataset.dia);
  });
});

// Listener das Abas
document.querySelectorAll('#tabs-partida button').forEach(btn => {
  btn.addEventListener('click', (e) => {
    const tabClicada = e.target.dataset.tab;
    
    document.querySelectorAll('#tabs-partida button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(`tab-${tabClicada}`).classList.add('active');

    if ((tabClicada === 'panorama' || tabClicada === 'insights') && !iaCarregada) {
       
       const jogo = jogosGlobal.find(j => String(j.id) === String(jogoAtualId));
       
       if (jogo && jogo.iaCache) {
           renderizarIA(jogo.iaCache.panorama, jogo.iaCache.insights, jogoAtualId);
           iaCarregada = true;
       } else {
           buscarIA(jogoAtualId);
       }
    }
  });
});

carregarVitrine();
</script>
</body>
</html>
