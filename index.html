<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hub de Futebol & IA</title>
<style>
:root {
  --pitch:#0A2B23; --pitch2:#0E3A2E; --paper:#FBFAF6; --ink:#10211C; --line:#E7E5DA;
  --pick:#00C27A; --pick2:#00A266; --pickink:#04150F; --gold:#E9B949; --muted:#7C8B83;
  --teal:#117A65; --shadow:0 10px 30px rgba(0,0,0,.18);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; padding:0; }
body {
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); min-height:100vh; padding-bottom:40px; position:relative;
  background:linear-gradient(180deg,var(--pitch),var(--pitch2));
}
body::before {
  content:""; position:fixed; inset:0; z-index:-2;
  background-image:url('https://images.unsplash.com/photo-1518605368461-1e1e38ce8058?q=80&w=1000&auto=format&fit=crop'); /* Fundo genérico de gramado */
  background-size:cover; background-position:center; opacity: 0.15;
}

.wrap { max-width:600px; margin:0 auto; padding:0 14px 60px; }
header { text-align:center; padding:22px 14px 14px; }
.eyebrow { font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:8px; }
h1 { margin:0; color:#fff; font-size:28px; font-weight:900; letter-spacing:.01em; text-transform:uppercase; }
h1 .thin { display:block; font-size:13px; font-weight:600; letter-spacing:.16em; color:#bfe8d6; margin-top:7px; }

/* Navegação e Filtros */
.filtros { display:flex; gap:7px; flex-wrap:wrap; margin:14px 0; justify-content: center; }
.filtros button {
  border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06);
  color:#cfe9dd; font-family:inherit; font-weight:700; font-size:13px;
  padding:7px 15px; border-radius:999px; cursor:pointer; transition: all 0.2s;
}
.filtros button.active { background:var(--teal); color:#fff; border-color:var(--teal); }

.day { display:flex; align-items:center; gap:10px; margin:18px 2px 10px; }
.day .dot { width:7px; height:7px; border-radius:99px; background:var(--gold); }
.day .d { color:#fff; font-weight:800; font-size:13px; letter-spacing:.05em; text-transform:uppercase; }
.day .line { flex:1; height:1px; background:rgba(255,255,255,.16); }

/* Cards de Jogo */
.match {
  background:var(--paper); border-radius:14px; box-shadow:var(--shadow);
  padding:12px 12px 13px; margin-bottom:11px; cursor: pointer;
  transition: transform 0.1s, box-shadow 0.2s;
}
.match:active { transform: scale(0.98); }
.match-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
.grp { display:flex; align-items:center; gap:6px; font-size:10px; font-weight:800; letter-spacing:.05em; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:3px 7px; }
.grp img { width: 14px; height: 14px; }
.st { font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:99px; }
.st.enc { background:#E9F7F0; color:var(--pick2); }
.st.pend { background:#EFEDE6; color:var(--muted); }
.st.live { background:#ef4444; color:#fff; animation: pulse 2s infinite; }

.teams { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:6px; }
.team { display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; }
.team img { width: 36px; height: 36px; object-fit: contain; } /* Escudos via API */
.team .nm { font-size:13px; font-weight:700; line-height:1.15; }

.vs { font-size:12px; font-weight:800; color:var(--muted); }
.score { font-size:26px; font-weight:900; color:var(--ink); font-variant-numeric:tabular-nums; min-width:62px; text-align:center; }
.score span { color:var(--muted); font-weight:700; margin:0 3px; font-size:18px; }
.score.pend { font-size:14px; font-weight:800; color:var(--muted); }

/* Views SPA */
.view { display: none; }
.view.active { display: block; animation: fadeIn 0.3s; }

/* Botão Voltar */
.btn-voltar {
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  color: #fff; padding: 8px 16px; border-radius: 99px; font-weight: 700;
  cursor: pointer; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 5px;
}

/* Tabs Internas da Partida */
.partida-tabs { display:flex; gap:6px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:5px; margin-bottom: 20px; }
.partida-tabs button { flex:1; border:none; background:transparent; color:#cfe9dd; font-weight:800; font-size:11.5px; padding:11px 3px; border-radius:10px; cursor:pointer; }
.partida-tabs button.active { background:var(--pick); color:var(--pickink); box-shadow:0 4px 12px rgba(0,194,122,.35); }

.tab-content { display: none; color: #fff; }
.tab-content.active { display: block; }
.panel { background: var(--paper); border-radius: 14px; padding: 16px; color: var(--ink); box-shadow: var(--shadow); }

@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
.loading { text-align:center; color:#cfe9dd; padding:40px; font-weight: bold; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">⚽ Inteligência & Estatísticas</div>
    <h1>Futebol Hub<span class="thin">Análises IA · Live Stats · Tendências</span></h1>
  </header>

  <!-- TELA INICIAL: VITRINE DE JOGOS -->
  <div id="view-vitrine" class="view active">
    <div class="filtros" id="filtros">
      <button data-dia="todos" class="active">Todos</button>
      <button data-dia="ontem">Ontem</button>
      <button data-dia="hoje">Hoje</button>
      <button data-dia="amanha">Amanhã</button>
    </div>
    <div id="lista-jogos"><div class="loading">Buscando agenda de jogos...</div></div>
  </div>

  <!-- TELA DE DETALHES DA PARTIDA -->
  <div id="view-partida" class="view">
    <button class="btn-voltar" onclick="voltarParaVitrine()">⬅ Voltar para Jogos</button>
    
    <!-- Cabeçalho do jogo selecionado será injetado aqui -->
    <div id="partida-header"></div>

    <div class="partida-tabs" id="tabs-partida">
      <button data-tab="panorama" class="active">🧠 Panorama IA</button>
      <button data-tab="insights">💰 Insights</button>
      <button data-tab="live">📊 Ao Vivo</button>
    </div>

    <!-- Abas de Conteúdo -->
    <div id="tab-panorama" class="tab-content active">
      <div class="panel" id="conteudo-panorama">
        <p style="text-align: center; color: var(--muted); font-weight: bold;">
          A IA está analisando este confronto taticamente... ⏳
        </p>
      </div>
    </div>
    
    <div id="tab-insights" class="tab-content">
      <div class="panel" id="conteudo-insights">
        <p style="text-align: center; color: var(--muted); font-weight: bold;">
          Buscando tendências de apostas... ⏳
        </p>
      </div>
    </div>

    <div id="tab-live" class="tab-content">
      <div class="panel" id="conteudo-live">
        <p style="text-align: center; color: var(--muted); font-weight: bold;">
          Estatísticas ao vivo carregarão aqui.
        </p>
      </div>
    </div>
  </div>
</div>

<script>
let jogosGlobal = [];

// Funções Utilitárias de Data
const formatarData = (isoStr) => {
  const d = new Date(isoStr);
  return d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' }).replace('.', '');
};
const formatarHora = (isoStr) => {
  const d = new Date(isoStr);
  return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
};
const pegarDataLocal = (isoStr) => new Date(isoStr).toLocaleDateString('pt-BR');

// Carrega os dados gerados pelo GitHub Actions
async function carregarVitrine() {
  try {
    const res = await fetch(`dados/vitrine.json?v=${Date.now()}`);
    if (!res.ok) throw new Error("Sem vitrine");
    const data = await res.json();
    jogosGlobal = data.jogos;
    renderizarJogos("todos");
  } catch (error) {
    document.getElementById('lista-jogos').innerHTML = 
      `<div class="loading" style="color:var(--gold);">Agenda ainda não gerada ou erro ao carregar.<br>Verifique o GitHub Actions!</div>`;
  }
}

// Renderiza a lista de jogos na tela inicial
function renderizarJogos(filtroDia) {
  const container = document.getElementById('lista-jogos');
  container.innerHTML = "";
  
  const hojeStr = new Date().toLocaleDateString('pt-BR');
  let ontem = new Date(); ontem.setDate(ontem.getDate() - 1);
  const ontemStr = ontem.toLocaleDateString('pt-BR');
  let amanha = new Date(); amanha.setDate(amanha.getDate() + 1);
  const amanhaStr = amanha.toLocaleDateString('pt-BR');

  let dataAtual = "";

  const jogosFiltrados = jogosGlobal.filter(j => {
    const dataJogo = pegarDataLocal(j.dataHora);
    if (filtroDia === "hoje") return dataJogo === hojeStr;
    if (filtroDia === "ontem") return dataJogo === ontemStr;
    if (filtroDia === "amanha") return dataJogo === amanhaStr;
    return true; // "todos"
  });

  if (jogosFiltrados.length === 0) {
    container.innerHTML = `<div class="loading">Nenhum jogo encontrado para esta data.</div>`;
    return;
  }

  jogosFiltrados.forEach(j => {
    const dataJogo = formatarData(j.dataHora);
    if (dataJogo !== dataAtual) {
      container.innerHTML += `<div class="day"><span class="dot"></span><span class="d">${dataJogo}</span><span class="line"></span></div>`;
      dataAtual = dataJogo;
    }

    // Traduzindo status da API
    let stHtml = `<span class="st pend">A iniciar</span>`;
    let scoreHtml = `<div class="score pend">${formatarHora(j.dataHora)}</div>`;
    
    if (['IN_PLAY', 'PAUSED', 'LIVE'].includes(j.status)) {
      stHtml = `<span class="st live">Ao Vivo</span>`;
      scoreHtml = `<div class="score">${j.casa.placar}<span>-</span>${j.fora.placar}</div>`;
    } else if (['FINISHED', 'AWARDED'].includes(j.status)) {
      stHtml = `<span class="st enc">Encerrado</span>`;
      scoreHtml = `<div class="score">${j.casa.placar}<span>-</span>${j.fora.placar}</div>`;
    }

    const card = `
      <div class="match" onclick="abrirJogo('${j.id}')">
        <div class="match-top">
          <span class="grp"><img src="${j.competicaoLogo}" alt=""> ${j.competicao}</span>
          ${stHtml}
        </div>
        <div class="teams">
          <div class="team">
            <img src="${j.casa.escudo}" alt="${j.casa.nome}">
            <span class="nm">${j.casa.nome}</span>
          </div>
          ${scoreHtml}
          <div class="team">
            <img src="${j.fora.escudo}" alt="${j.fora.nome}">
            <span class="nm">${j.fora.nome}</span>
          </div>
        </div>
      </div>
    `;
    container.innerHTML += card;
  });
}

// Navegação SPA
function abrirJogo(id) {
  const jogo = jogosGlobal.find(j => String(j.id) === String(id));
  if (!jogo) return;

  // Esconde Vitrine, Mostra Partida
  document.getElementById('view-vitrine').classList.remove('active');
  document.getElementById('view-partida').classList.add('active');
  window.scrollTo({top: 0, behavior: 'smooth'});

  // Monta o Header do Jogo copiando o visual do card
  let scoreText = ['FINISHED', 'IN_PLAY', 'PAUSED'].includes(jogo.status) 
    ? `${jogo.casa.placar} - ${jogo.fora.placar}` 
    : formatarHora(jogo.dataHora);

  document.getElementById('partida-header').innerHTML = `
    <div class="match" style="cursor: default; transform: none; box-shadow: none;">
       <div style="text-align:center; font-size: 11px; font-weight: bold; color: var(--muted); margin-bottom: 10px;">
          ${jogo.competicao} · ${formatarData(jogo.dataHora)}
       </div>
       <div class="teams">
          <div class="team"><img src="${jogo.casa.escudo}"><span class="nm">${jogo.casa.nome}</span></div>
          <div class="score">${scoreText}</div>
          <div class="team"><img src="${jogo.fora.escudo}"><span class="nm">${jogo.fora.nome}</span></div>
        </div>
    </div>
  `;

// Dentro da função abrirJogo(id), APÓS a montagem do header:
  
  // 1. Reseta os textos para o "Loading..."
  document.getElementById('conteudo-panorama').innerHTML = '<p style="text-align: center; color: var(--muted); font-weight: bold;">A IA está analisando este confronto taticamente... ⏳</p>';
  document.getElementById('conteudo-insights').innerHTML = '<p style="text-align: center; color: var(--muted); font-weight: bold;">Buscando tendências... ⏳</p>';
  document.getElementById('conteudo-live').innerHTML = '<p style="text-align: center; color: var(--muted); font-weight: bold;">Carregando estatísticas... ⏳</p>';

  // 2. Chama a nossa Serverless Function (A Vercel entende a rota /api/ automaticamente)
  fetch(`/api/analise?jogoId=${id}`)
    .then(response => response.json())
    .then(data => {
      if (data.error) {
        document.getElementById('conteudo-panorama').innerHTML = `<p style="color: red;">Erro: ${data.error}</p>`;
        return;
      }

      // Preenche a Aba 1: Panorama
      document.getElementById('conteudo-panorama').innerHTML = `
        <p style="line-height: 1.6; font-size: 14px;">${data.panorama.replace(/\n/g, '<br>')}</p>
      `;

      // Preenche a Aba 2: Insights
      // A IA vai mandar em bullet points, então formatamos direitinho:
      const insightsHtml = data.insights.split('\n').map(linha => {
        if (linha.trim() === '') return '';
        return `<li style="margin-bottom: 10px; line-height: 1.5; font-size: 14px;">${linha.replace(/^-\s*/, '')}</li>`;
      }).join('');
      
      document.getElementById('conteudo-insights').innerHTML = `
        <ul style="padding-left: 20px; color: var(--gold);">${insightsHtml}</ul>
      `;

      // Preenche a Aba 3: Ao Vivo
      const stats = data.liveStats;
      const arbitro = stats.referees && stats.referees.length > 0 ? stats.referees[0].name : 'Não informado';
      
      document.getElementById('conteudo-live').innerHTML = `
        <div style="font-size: 13px; line-height: 1.8;">
          <p><b>Estádio:</b> ${stats.venue || 'Não informado'}</p>
          <p><b>Árbitro:</b> ${arbitro}</p>
          <p><b>Rodada:</b> ${stats.matchday || '-'}</p>
          <hr style="border: 0; border-top: 1px solid var(--line); margin: 15px 0;">
          <p style="text-align:center; color: var(--muted);">
            <i>Em breve: Gráficos de posse de bola, chutes e faltas via estatísticas ao vivo.</i>
          </p>
        </div>
      `;
    })
    .catch(err => {
      document.getElementById('conteudo-panorama').innerHTML = '<p style="color: red;">Falha ao conectar com o servidor.</p>';
    });
}

function voltarParaVitrine() {
  document.getElementById('view-partida').classList.remove('active');
  document.getElementById('view-vitrine').classList.add('active');
  
  // Reseta as abas para o padrão (Panorama) ao fechar
  document.querySelectorAll('#tabs-partida button').forEach(b => b.classList.remove('active'));
  document.querySelector('#tabs-partida button[data-tab="panorama"]').classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-panorama').classList.add('active');
}

// Event Listeners (Filtros e Abas)
document.querySelectorAll('#filtros button').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('#filtros button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    renderizarJogos(e.target.dataset.dia);
  });
});

document.querySelectorAll('#tabs-partida button').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('#tabs-partida button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(`tab-${e.target.dataset.tab}`).classList.add('active');
  });
});

// Inicialização
carregarVitrine();
</script>
</body>
</html>
